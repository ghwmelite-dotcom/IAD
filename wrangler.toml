# Cloudflare Pages project configuration
name = "iad-ohcs"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────────────
# Production (default) environment
# ──────────────────────────────────────────────────────────────────────

# D1 database (relational data)
[[d1_databases]]
binding = "DB"
database_name = "iad-platform"
database_id = "9aef7df8-ddf1-4a6c-837f-04c186bc1c2f"

# R2 bucket (uploaded files)
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "iad-uploads"

# Workers AI binding (document sanity checks)
[ai]
binding = "AI"

# Non-secret env vars
#
# EMAIL: sender is the Resend sandbox `onboarding@resend.dev` until IAD
# infra adds Domain Lockdown + SPF records for its own domain. Swap
# EMAIL_FROM and set EMAIL_PROVIDER='auto' (or remove) when ready.
# RESEND_API_KEY is set as a secret via:
#   npx wrangler pages secret put RESEND_API_KEY --project-name=iad-ohcs
[vars]
APP_NAME = "IAD Platform"
APP_ENV = "preview"
EMAIL_FROM = "onboarding@resend.dev"
EMAIL_FROM_NAME = "Internal Audit Department (Test)"
EMAIL_PROVIDER = "resend"

# ──────────────────────────────────────────────────────────────────────
# Preview environment (Cloudflare Pages preview deployments)
# Preview shares the same D1/R2/AI resources as production in v1.
# ──────────────────────────────────────────────────────────────────────
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "iad-platform"
database_id = "9aef7df8-ddf1-4a6c-837f-04c186bc1c2f"

[[env.preview.r2_buckets]]
binding = "UPLOADS"
bucket_name = "iad-uploads"

[env.preview.ai]
binding = "AI"

[env.preview.vars]
APP_NAME = "IAD Platform (Preview)"
APP_ENV = "preview"
EMAIL_FROM = "onboarding@resend.dev"
EMAIL_FROM_NAME = "Internal Audit Department (Preview)"
EMAIL_PROVIDER = "resend"
